name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Compile
        run: python -m compileall -q silver_screen streamlit_app.py
      - name: Test
        run: python -m pytest -q
      - name: Health
        run: python -m silver_screen health --json
      - name: Headless smoke run
        run: |
          python -m silver_screen run \
            --premise "A technician discovers that repaired machines remember their failures." \
            --genre scifi \
            --format short \
            --media off \
            --no-persist \
            --json > smoke-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("smoke-result.json").read_text())
          assert result["status"] == "complete"
          assert result["metrics"]["finalScore"] >= result["metrics"]["initialScore"]
          PY

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate routes and build secondary studio
        run: npm run build:dev
      - run: npm run typecheck
