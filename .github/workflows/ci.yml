name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import package + TGRM smoke test
        run: |
          python - <<'PY'
          from silver_screen.science import SCIENCE
          from silver_screen.script_engine import generate_and_repair
          assert SCIENCE["tau"] == 0.6
          result = generate_and_repair(
              title="CI Smoke",
              premise="A repair agent detects drift in a city grid and must choose minimal correction over collapse.",
              genre="noir",
              format_key="trailer",
          )
          assert result["state"]["script"]
          assert result["metrics"].energy >= 1
          assert result["msil"].verdict in ("stable", "repairing", "unstable")
          print("TGRM OK", result["metrics"].rye, result["msil"].verdict)
          PY
      - name: Streamlit importable
        run: python -c "import streamlit; import silver_screen; print('streamlit', streamlit.__version__)"

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
