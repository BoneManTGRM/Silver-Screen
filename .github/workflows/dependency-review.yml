name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom")"
          if [ "${status}" = "200" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "Dependency graph unavailable (HTTP ${status}); dependency review will be skipped."
          fi

      - name: Checkout repository
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Dependency Review
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: always

      - name: Record intentional skip
        if: steps.dependency-graph.outputs.available != 'true'
        run: |
          echo "::notice::Dependency review skipped because the repository dependency graph is disabled. Enable the dependency graph to activate this check."
