name: iPhone build

on:
  pull_request:
    paths:
      - ios/**
      - .github/workflows/ios.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -quiet -project ios/SilverScreen.xcodeproj -scheme SilverScreen \
            -destination 'generic/platform=iOS' -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/silver-screen-build" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/silver-screen-build/Build/Products/Debug-iphoneos/SilverScreen.app"
          test -x "$app/SilverScreen"
          test -s "$app/Assets.car"
          plutil -lint "$app/PrivacyInfo.xcprivacy"
